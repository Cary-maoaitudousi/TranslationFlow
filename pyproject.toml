[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translationflow"
version = "2.0.0"
description = "通用同人/长篇小说英译中流水线：专有名词表 + IP 档案 + AI 翻译 + 人工审核 + 导出 Word，成本可控"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "catlikepotato" }]
keywords = ["translation", "deepseek", "docx", "fanfic", "glossary", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "openai>=1.40.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "PySide6-Essentials>=6.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pyinstaller>=6.0"]

[project.scripts]
translationflow = "tf.gui.main_window:main"
translationflow-cli = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["tf", "tf.gui", "tf.review"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
